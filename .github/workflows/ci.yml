name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra online --python "${{ matrix.python-version }}"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: PYTHONDONTWRITEBYTECODE=1 uv run --locked pytest
      - run: >-
          PYTHONDONTWRITEBYTECODE=1 uv run --locked python -m offline.run
          --config offline/fixtures/config.toml
          --output "${RUNNER_TEMP}/bettercallagent-smoke"
      - if: matrix.python-version == '3.12'
        run: uv run --locked python scripts/check_release.py
      - if: matrix.python-version == '3.12'
        run: uv run --locked python -m build
      - if: matrix.python-version == '3.12'
        run: uv run --locked python scripts/check_distribution.py dist

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
