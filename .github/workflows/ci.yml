name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true
      - run: uv sync --locked --extra dev --extra online --python "${{ matrix.python-version }}"
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: PYTHONDONTWRITEBYTECODE=1 uv run --locked pytest
      - run: >-
          PYTHONDONTWRITEBYTECODE=1 uv run --locked python -m offline.run
          --config offline/fixtures/config.toml
          --output "${RUNNER_TEMP}/bettercallagent-smoke"
      - if: matrix.python-version == '3.12'
        run: uv run --locked python scripts/check_release.py
      - if: matrix.python-version == '3.12'
        run: uv run --locked python -m build
      - if: matrix.python-version == '3.12'
        run: uv run --locked python scripts/check_distribution.py dist

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
