max_tokens = 4096
document_char_limit = 0
base_url_env = "BCA_RERANK_BASE_URL"
api_key_env = "BCA_RERANK_API_KEY"

[citation_gate]
candidate_top_k = 10
minimum_dense_votes = 4
anchor_top_k = 3
anchor_minimum_score = 8.5
