model_revision = "1d8ad4ca9b3dd8059ad90a75d4983776a23d44af"
device = "cuda:0"
batch_size = 16
max_length = 1024
chunk_size = 30000
allow_model_download = false
fields = ["normal_query", "meta_searchterm", "keywords", "fulltext", "citations"]
field_top_k = 1000
fusion_top_k = 1000
rrf_k = 60
weights = { normal_query = 0.40, meta_searchterm = 1.25, keywords = 0.85, fulltext = 1.35, citations = 0.15 }

[reranking]
model = "qwen3-30b-a3b-instruct-2507"
